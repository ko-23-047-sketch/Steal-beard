<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Косметика — Steel Beard</title>
    <style>
        :root {
            --orange: #ff751f; 
            --btn-orange: #f08244;
            --dark: #1a1a1a;
            --light-grey: #f4f4f4;
            --table-bg: #d9d9d9;
            --text-muted: #555;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0; padding: 0; color: #333; background-color: #fff;
            -webkit-font-smoothing: antialiased; scroll-behavior: smooth;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; box-sizing: border-box; }

        /* HEADER */
        header {
            background-color: var(--dark); color: white; padding: 15px 0;
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-box { display: flex; justify-content: space-between; align-items: center; }
        
        nav { display: flex; }
        nav a { color: white; text-decoration: none; margin-right: 25px; font-weight: bold; font-size: 14px; transition: color 0.3s; }
        nav a:hover { color: var(--orange); }
        nav a.active { color: var(--orange); }
        
        .header-actions { display: flex; align-items: center; gap: 20px; }

        .header-phone { font-weight: bold; font-size: 16px; white-space: nowrap; }
        .btn-header { background-color: var(--orange); color: white; padding: 10px 25px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: background-color 0.3s; }
        .btn-header:hover { background-color: var(--btn-orange); }

        /* Бургер-меню для мобилок */
        .burger-menu { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 5px; z-index: 1001; }
        .burger-menu span { display: block; width: 25px; height: 3px; background-color: white; transition: 0.3s; }

        /* СТРАНИЦА КОСМЕТИКИ */
        .page-title { font-size: 42px; text-transform: uppercase; margin: 50px 0 30px; border-left: 6px solid var(--orange); padding-left: 20px; font-family: 'Georgia', serif; }
        
        .cosmetics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-bottom: 80px; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; transition: transform 0.3s; border: 1px solid #eee; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 280px; object-fit: cover; background-color: #f9f9f9; }
        .product-info { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-brand { font-size: 12px; text-transform: uppercase; color: var(--orange); font-weight: bold; margin-bottom: 5px; }
        .product-title { font-size: 20px; margin: 0 0 10px; font-weight: bold; color: var(--dark); }
        .product-desc { font-size: 14px; color: #666; line-height: 1.4; margin: 0 0 20px; flex-grow: 1; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .product-price { font-size: 22px; font-weight: bold; color: var(--dark); }
        .btn-buy { background-color: var(--dark); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-buy:hover { background-color: var(--orange); }

        /* КОРЗИНА И ОФОРМЛЕНИЕ */
        .cart-section { background: var(--light-grey); padding: 60px 0; border-top: 1px solid #ddd; }
        .cart-box { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .cart-title { font-size: 28px; margin-top: 0; margin-bottom: 20px; text-transform: uppercase; color: var(--dark); }
        
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; text-align: left; }
        .cart-table th { padding: 15px; border-bottom: 2px solid #ddd; text-transform: uppercase; font-size: 13px; color: #777; }
        .cart-table td { padding: 15px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .cart-item-title { font-weight: bold; font-size: 16px; }
        .cart-count-btn { background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .cart-count-btn:hover { background: var(--orange); color: white; }
        .cart-count-val { margin: 0 12px; font-weight: bold; display: inline-block; min-width: 20px; text-align: center; }
        .cart-remove-btn { background: none; border: none; color: #cc0000; cursor: pointer; font-size: 20px; }

        .cart-summary { display: flex; justify-content: space-between; align-items: center; background: var(--dark); color: white; padding: 25px 30px; border-radius: 20px; margin-bottom: 40px; }
        .cart-total-label { font-size: 18px; text-transform: uppercase; font-weight: bold; }
        .cart-total-val { font-size: 28px; font-weight: bold; color: var(--orange); }

        /* ФОРМА ЗАКАЗА КОРЗИНЫ */
        .order-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; }
        .form-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; background: #fafafa; }
        .form-group input:focus { border-color: var(--orange); outline: none; background: white; }
        .btn-order-submit { grid-column: span 2; background: var(--orange); color: white; padding: 18px; border: none; border-radius: 15px; font-weight: bold; font-size: 18px; cursor: pointer; text-transform: uppercase; transition: background-color 0.3s; margin-top: 10px; }
        .btn-order-submit:hover { background-color: var(--btn-orange); }
        .btn-order-submit:disabled { background: #aaa; cursor: not-allowed; }

        footer { background: var(--dark); padding: 50px 0; color: white; text-align: center; }

        /* --- СТИЛИ ДЛЯ ВНУТРЕННЕЙ ПОЧТЫ УВЕДОМЛЕНИЙ --- */
        .mail-btn-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .btn-mail {
            background: #222;
            border: 1px solid var(--orange);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: 0.3s;
        }
        .btn-mail:hover {
            background: var(--orange);
            transform: scale(1.05);
        }
        .mail-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: red;
            color: white;
            font-size: 11px;
            font-weight: bold;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .mail-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .mail-tab {
            background: #222;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .mail-tab.active {
            background: var(--orange);
            color: white;
            border-color: var(--orange);
        }
        .mail-list {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .mail-item {
            background: #222;
            border-left: 4px solid var(--orange);
            padding: 12px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            line-height: 1.4;
            text-align: left;
            color: white;
        }
        .mail-item .mail-date {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
            display: block;
        }
        .mail-item strong {
            color: var(--orange);
        }
        .mail-empty {
            text-align: center;
            color: #888;
            padding: 20px 0;
        }

        /* MODAL (Для внутренней почты) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px); padding: 20px; box-sizing: border-box; }
        .modal-content { background: var(--dark); color: white; padding: 40px 30px; border-radius: 35px; width: 100%; max-width: 450px; position: relative; border: 2px solid var(--orange); box-shadow: 0 0 40px rgba(255, 117, 31, 0.3); box-sizing: border-box; overflow-y: auto; max-height: 90vh; }
        .modal-close { position: absolute; top: 20px; right: 25px; font-size: 35px; cursor: pointer; color: #fff; }

        /* --- АДАПТИВНОСТЬ --- */
        @media (max-width: 768px) {
            .burger-menu { display: flex; }
            nav {
                position: fixed; top: 70px; left: -100%; width: 100%; height: calc(100vh - 70px);
                background-color: var(--dark); flex-direction: column; align-items: center;
                padding-top: 40px; gap: 25px; transition: 0.4s ease; z-index: 999;
            }
            nav.active { left: 0; }
            nav a { margin-right: 0; font-size: 18px; }

            .header-phone { display: none; }
            .order-form-grid { grid-template-columns: 1fr; }
            .btn-order-submit { grid-column: span 1; }
            .cart-box { padding: 20px; }
            .cart-table th, .cart-table td { padding: 10px 5px; font-size: 14px; }
            .page-title { font-size: 32px; margin: 30px 0 20px; }
        }
    </style>
</head>
<body>

<header>
    <div class="container nav-box">
        <button class="burger-menu" id="burgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="navMenu">
            <a href="index.html">Главная</a>
            <a href="staff.html">Персонал</a>
            <a href="services.html">Услуги</a>
            <a href="cosmetics.html" class="active">Косметика</a>
        </nav>
        <div class="header-actions">
            <span class="header-phone">+7 777 726 22 88</span>
            
            <div class="mail-btn-container">
                <button class="btn-mail" id="openMailBtn">✉</button>
                <div class="mail-badge" id="mailBadge">0</div>
            </div>

            <a href="index.html#modal" style="text-decoration: none;"><button class="btn-header">Записаться</button></a>
        </div>
    </div>
</header>

<main class="container">
    <h1 class="page-title">Премиальный уход</h1>
    
    <div class="cosmetics-grid" id="productsGrid">
        </div>
</main>

<section class="cart-section" id="cartSection" style="display: none;">
    <div class="container">
        <div class="cart-box">
            <h2 class="cart-title">Ваша корзина</h2>
            
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена</th>
                        <th>Количество</th>
                        <th>Всего</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cartItemsContainer">
                    </tbody>
            </table>

            <div class="cart-summary">
                <span class="cart-total-label">Итого к оплате:</span>
                <span class="cart-total-val" id="cartTotalOutput">0 ₸</span>
            </div>

            <h2 class="cart-title" style="margin-top: 40px;">Данные получателя</h2>
            <form id="orderForm">
                <div class="order-form-grid">
                    <div class="form-group">
                        <label>Ваше имя</label>
                        <input type="text" id="orderName" placeholder="Иван" required>
                    </div>
                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="tel" id="orderPhone" placeholder="+7 (777) 777 77 77" required>
                    </div>
                    <button type="submit" class="btn-order-submit" id="orderSubmitBtn">Оформить заказ</button>
                </div>
            </form>
        </div>
    </div>
</section>

<div class="modal-overlay" id="mailModal">
    <div class="modal-content" style="max-width: 600px;">
        <span class="modal-close" id="closeMailModal">&times;</span>
        <h2 style="text-align:center; color:var(--orange); text-transform:uppercase; margin-bottom:20px;">Внутренняя почта</h2>
        
        <div class="mail-tabs">
            <div class="mail-tab active" id="tabHaircuts">Стрижки (<span id="countHaircuts">0</span>)</div>
            <div class="mail-tab" id="tabCosmetics">Косметика (<span id="countCosmetics">0</span>)</div>
        </div>

        <div class="mail-list" id="mailListContainer">
            </div>
    </div>
</div>

<footer>
    <div class="container">
        <p>© 2026 STEEL BEARD BARBERSHOP. <br> Алматы, пр. Назарбаева 100. Тел: +7 777 726 22 88</p>
    </div>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    // Конфигурация Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBjsTDpE_CLV8kyWdY2vLGJyS-em_SQF3k",
        authDomain: "diplom-f94fb.firebaseapp.com",
        projectId: "diplom-f94fb",
        storageBucket: "diplom-f94fb.firebasestorage.app",
        messagingSenderId: "318059526136",
        appId: "1:318059526136:web:1767749fb5255bf80d080d",
        measurementId: "G-139BDNRX6Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // МОБИЛЬНОЕ МЕНЮ (БУРГЕР)
    const burgerBtn = document.getElementById('burgerBtn');
    const navMenu = document.getElementById('navMenu');

    burgerBtn.addEventListener('click', () => {
        navMenu.classList.toggle('active');
        burgerBtn.classList.toggle('open');
    });

    // ДАННЫЕ ТОВАРОВ
    const products = [
        { id: 'p1', brand: 'Reuzel', title: 'Помада Blue Strong Hold', desc: 'Водорастворимая помада сильной фиксации с эффектом сияния. Идеальна для классических помпадуров.', price: 9500, img: 'https://images.unsplash.com/photo-1608248597481-496100c80836?auto=format&fit=crop&q=80&w=500' },
        { id: 'p2', brand: 'Morgan\'s', title: 'Масло для бороды Luxury', desc: 'Смягчает жесткие волосы, увлажняет кожу лица под бородой. Аромат бергамота, лайма и мускуса.', price: 12000, img: 'https://images.unsplash.com/photo-1626015713026-d8309ded11c7?auto=format&fit=crop&q=80&w=500' },
        { id: 'p3', brand: 'Lock Stock & Barrel', title: 'Текстурирующая пудра', desc: 'Придает моментальный прикорневой объем и матовый финиш. Незаметна на темных волосах.', price: 11000, img: 'https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&q=80&w=500' },
        { id: 'p4', brand: 'Preraso', title: 'Крем до бритья (Эвкалипт)', desc: 'Классическая итальянская формула. Размягчает самую жесткую щетину и подготавливает кожу.', price: 5500, img: 'https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?auto=format&fit=crop&q=80&w=500' },
        { id: 'p5', brand: 'American Crew', title: 'Шампунь Daily Cleansing', desc: 'Для ежедневного очищения нормальных и склонных к жирности волос. Эффективно смывает стайлинг.', price: 8000, img: 'https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?auto=format&fit=crop&q=80&w=500' },
        { id: 'p6', brand: 'Borodach', title: 'Бальзам для бороды Citrus', desc: 'Фиксирует форму бороды и защищает ее от негативного влияния городской пыли и ветра.', price: 6500, img: 'https://images.unsplash.com/photo-1626015713026-d8309ded11c7?auto=format&fit=crop&q=80&w=500' }
    ];

    let cart = {};

    // Отрендерить витрину
    const productsGrid = document.getElementById('productsGrid');
    products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
            <img src="${p.img}" alt="${p.title}" class="product-img">
            <div class="product-info">
                <span class="product-brand">${p.brand}</span>
                <h3 class="product-title">${p.title}</h3>
                <p class="product-desc">${p.desc}</p>
                <div class="product-footer">
                    <span class="product-price">${p.price.toLocaleString('ru-RU')} ₸</span>
                    <button class="btn-buy" data-id="${p.id}">В корзину</button>
                </div>
            </div>
        `;
        productsGrid.appendChild(card);
    });

    // Логика добавления в корзину
    productsGrid.addEventListener('click', (e) => {
        if(e.target.classList.contains('btn-buy')) {
            const id = e.target.getAttribute('data-id');
            if(cart[id]) {
                cart[id]++;
            } else {
                cart[id] = 1;
            }
            updateCartUI();
        }
    });

    function updateCartUI() {
        const cartSection = document.getElementById('cartSection');
        const container = document.getElementById('cartItemsContainer');
        const totalOutput = document.getElementById('cartTotalOutput');
        
        container.innerHTML = '';
        let totalSum = 0;
        let itemsCount = 0;

        Object.keys(cart).forEach(id => {
            const product = products.find(p => p.id === id);
            if(!product) return;

            const count = cart[id];
            const itemTotal = product.price * count;
            totalSum += itemTotal;
            itemsCount += count;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <div class="cart-item-title">${product.brand} ${product.title}</div>
                </td>
                <td>${product.price.toLocaleString('ru-RU')} ₸</td>
                <td>
                    <button class="cart-count-btn minus" data-id="${id}">-</button>
                    <span class="cart-count-val">${count}</span>
                    <button class="cart-count-btn plus" data-id="${id}">+</button>
                </td>
                <td><b>${itemTotal.toLocaleString('ru-RU')} ₸</b></td>
                <td><button class="cart-remove-btn" data-id="${id}">&times;</button></td>
            `;
            container.appendChild(row);
        });

        totalOutput.textContent = totalSum.toLocaleString('ru-RU') + ' ₸';

        if(itemsCount > 0) {
            cartSection.style.display = 'block';
        } else {
            cartSection.style.display = 'none';
        }
    }

    // Кнопки управления количеством в корзине
    document.getElementById('cartItemsContainer').addEventListener('click', (e) => {
        const id = e.target.getAttribute('data-id');
        if(!id) return;

        if(e.target.classList.contains('plus')) {
            cart[id]++;
        } else if(e.target.classList.contains('minus')) {
            if(cart[id] > 1) cart[id]--;
            else delete cart[id];
        } else if(e.target.classList.contains('cart-remove-btn')) {
            delete cart[id];
        }
        updateCartUI();
    });

    // Оформление заказа и отправка в Firebase
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('orderSubmitBtn');
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'ОТПРАВКА...';

        const clientName = document.getElementById('orderName').value;
        const clientPhone = document.getElementById('orderPhone').value;

        // Формируем текстовую строку со списком заказанных товаров
        let productsListText = [];
        let totalSumValue = 0;

        Object.keys(cart).forEach(id => {
            const product = products.find(p => p.id === id);
            if(product) {
                productsListText.push(`${product.brand} ${product.title} (x${cart[id]})`);
                totalSumValue += product.price * cart[id];
            }
        });

        try {
            await addDoc(collection(db, "cosmetics_orders"), {
                clientName: clientName,
                clientPhone: clientPhone,
                products: productsListText.join(', '),
                totalPrice: totalSumValue,
                createdAt: new Date().toISOString()
            });

            alert('Спасибо за заказ! Наш менеджер свяжется с вами для подтверждения.');
            cart = {};
            updateCartUI();
            document.getElementById('orderForm').reset();
        } catch(err) {
            console.error("Ошибка Firebase: ", err);
            alert('Произошла ошибка при отправке заказа. Пожалуйста, повторите позже.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Оформить заказ';
        }
    };


    // ========================================================
    // --- ЛОГИКА ВНУТРЕННЕЙ ПОЧТЫ (УВЕДОМЛЕНИЙ АДМИНИСТРАТОРА) ---
    // ========================================================
    const mailModal = document.getElementById('mailModal');
    const openMailBtn = document.getElementById('openMailBtn');
    const closeMailModal = document.getElementById('closeMailModal');
    const mailBadge = document.getElementById('mailBadge');
    const mailListContainer = document.getElementById('mailListContainer');
    
    const tabHaircuts = document.getElementById('tabHaircuts');
    const tabCosmetics = document.getElementById('tabCosmetics');
    const countHaircuts = document.getElementById('countHaircuts');
    const countCosmetics = document.getElementById('countCosmetics');

    let currentTab = 'haircuts'; 
    let dataHaircuts = [];
    let dataCosmetics = [];

    // Открытие / Закрытие почты
    openMailBtn.onclick = () => {
        mailModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        mailBadge.style.display = 'none';
    };
    closeMailModal.onclick = () => {
        mailModal.style.display = 'none';
        document.body.style.overflow = 'auto';
    };
    window.addEventListener('click', (e) => {
        if (e.target === mailModal) {
            mailModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    });

    tabHaircuts.onclick = () => { switchTab('haircuts'); };
    tabCosmetics.onclick = () => { switchTab('cosmetics'); };

    function switchTab(tab) {
        currentTab = tab;
        tabHaircuts.classList.toggle('active', tab === 'haircuts');
        tabCosmetics.classList.toggle('active', tab === 'cosmetics');
        renderMail();
    }

    // Слушаем в реальном времени коллекцию 'appointments' (стрижки)
    const qAppointments = query(collection(db, "appointments"), orderBy("createdAt", "desc"));
    onSnapshot(qAppointments, (snapshot) => {
        dataHaircuts = [];
        snapshot.forEach((doc) => {
            dataHaircuts.push(doc.data());
        });
        countHaircuts.textContent = dataHaircuts.length;
        updateBadgeAndRender();
    });

    // Слушаем в реальном времени коллекцию 'cosmetics_orders' (заказы косметики)
    const qCosmetics = query(collection(db, "cosmetics_orders"), orderBy("createdAt", "desc"));
    onSnapshot(qCosmetics, (snapshot) => {
        dataCosmetics = [];
        snapshot.forEach((doc) => {
            dataCosmetics.push(doc.data());
        });
        countCosmetics.textContent = dataCosmetics.length;
        updateBadgeAndRender();
    }, (err) => {
        console.log("Коллекция 'cosmetics_orders' пока пуста или не создана.");
    });

    function updateBadgeAndRender() {
        const totalNotifications = dataHaircuts.length + dataCosmetics.length;
        if (totalNotifications > 0 && mailModal.style.display !== 'flex') {
            mailBadge.textContent = totalNotifications;
            mailBadge.style.display = 'flex';
        }
        renderMail();
    }

    function renderMail() {
        mailListContainer.innerHTML = '';
        const list = currentTab === 'haircuts' ? dataHaircuts : dataCosmetics;

        if (list.length === 0) {
            mailListContainer.innerHTML = `<div class="mail-empty">Уведомлений пока нет</div>`;
            return;
        }

        list.forEach(item => {
            const date = item.createdAt ? new Date(item.createdAt).toLocaleString('ru-RU') : 'Только что';
            let html = '';

            if (currentTab === 'haircuts') {
                html = `
                    <div class="mail-item">
                        <span class="mail-date">${date}</span>
                        <strong>Новая запись на стрижку!</strong><br>
                        <b>Клиент:</b> ${item.clientName || 'Не указано'} (${item.clientPhone || 'Нет номера'})<br>
                        <b>Услуга:</b> ${item.service || '—'}<br>
                        <b>Мастер:</b> ${item.masterName || '—'} (${item.masterRank || '—'})<br>
                        <b>Время:</b> ${item.bookingDayOfWeek || '—'}, ${item.bookingTime || '—'}<br>
                        <b>Стоимость:</b> ${item.price ? item.price.toLocaleString('ru-RU') : 0} ₸
                    </div>
                `;
            } else {
                html = `
                    <div class="mail-item" style="border-left-color: #25d366;">
                        <span class="mail-date">${date}</span>
                        <strong>Новый заказ косметики!</strong><br>
                        <b>Клиент:</b> ${item.clientName || 'Не указано'} (${item.clientPhone || 'Нет номера'})<br>
                        <b>Товары:</b> ${item.products || 'Список пуст'}<br>
                        <b>Сумма заказа:</b> ${item.totalPrice ? item.totalPrice.toLocaleString('ru-RU') : 0} ₸
                    </div>
                `;
            }
            mailListContainer.insertAdjacentHTML('beforeend', html);
        });
    }
</script>

</body>
</html>
